  <div class="signin">

<script>
  $("#togglePassword").click(function () {
    var $passwordInput = $("#password");
    if ($passwordInput.attr("type") === "password") {
      $passwordInput.attr("type", "text");
      $(this).html("<i class='fa fa-eye'></i>");
    } else {
      $passwordInput.attr("type", "password");
      $(this).html("<i class='fa fa-eye-slash' aria-hidden='true'></i>");
    }
  });

  $("#toggleconfirm").click(function () {
    var $passwordInput = $("#resetpassword");
    if ($passwordInput.attr("type") === "password") {
      $passwordInput.attr("type", "text");
      $(this).html("<i class='fa fa-eye'></i>");
    } else {
      $passwordInput.attr("type", "password");
      $(this).html("<i class='fa fa-eye-slash' aria-hidden='true'></i>");
    }
  });

  $(document).on("click", "#forget", function (e) {
    e.preventDefault();
    var name = $("#name").val();
    var password = $("#password").val();
    var resetpassword = $("#resetpassword").val();

    if (!name || !password || !resetpassword) {
      toastr.error("请先填写账号或者密码与重置密码");
      return;
    }

    if (password !== resetpassword) {
      toastr.error("密码与重置密码不一致，请重新输入");
      $("#password, #resetpassword").val("");
      return;
    }

    $.ajax({
      type: "POST",
      url: "/forgotpassword",
      data: {
        name: name,
        password: password,
        resetpassword: resetpassword,
      },
      success: function (response) {
        if (response.code) {
          toastr.success(response.message);
          setTimeout(function () {
            window.location.href = "/login";
          }, 2500);
        } else {
          toastr.error(response.message);
        }
      },
      error: function (xhr, status, error) {
        toastr.error("重置密码失败，请稍后再试");
      },
    });
  });
</script>
